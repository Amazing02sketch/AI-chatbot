<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Client Assistant</title>
  <style>
    /* Floating Widget Button */
    #chat-widget-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 9999;
    }

    /* Chat Container */
    #chat-container {
      display: none;
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 340px;
      height: 480px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      flex-direction: column;
      overflow: hidden;
      font-family: Arial, sans-serif;
      z-index: 9999;
    }

    /* Header */
    .chat-header {
      background: #007bff;
      color: white;
      padding: 15px;
      font-weight: bold;
      text-align: center;
    }

    /* Messages Box */
    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      background: #007bff;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .bot {
      background: #f1f1f1;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    /* Input Bar */
    .chat-input-bar {
      display: flex;
      padding: 10px;
      border-top: 1px solid #eee;
    }

    .chat-input-bar input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }

    .chat-input-bar button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-left: 5px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Floating Chat Button -->
  <button id="chat-widget-button" onclick="toggleChat()">💬</button>

  <!-- Chat Window -->
  <div id="chat-container">
    <div class="chat-header">AI Support Assistant / الدعم الفني</div>
    <div id="chat-box">
      <div class="msg bot">Hello! How can I help you today?<br>أهلاً بك! كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="userInput" placeholder="Type a message / اكتب message..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // 1. PASTE YOUR GOOGLE AI STUDIO API KEY HERE
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";

    function toggleChat() {
      const container = document.getElementById("chat-container");
      container.style.display = container.style.display === "flex" ? "none" : "flex";
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, "user");
      input.value = "";

      const chatBox = document.getElementById("chat-box");
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "msg bot";
      loadingDiv.innerText = "Typing...";
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Calling Gemini API
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: "You are an official client assistant. Reply concisely and politely. Always reply in the exact language the user speaks (English or Arabic):\n\nUser: " + text
              }]
            }]
          })
        });

        const data = await response.json();
        chatBox.removeChild(loadingDiv);

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMsg(reply, "bot");
        } else {
          appendMsg("Sorry, I could not process your request.", "bot");
        }
      } catch (err) {
        chatBox.removeChild(loadingDiv);
        appendMsg("Connection error. Check your API key.", "bot");
      }
    }

    function appendMsg(text, sender) {
      const chatBox = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.innerText = text;
      
      // Auto-detect Arabic text for Right-To-Left (RTL) alignment
      const isArabic = /[\u0600-\u06FF]/.test(text);
      if (isArabic) {
        div.style.direction = "rtl";
        div.style.textAlign = "right";
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
